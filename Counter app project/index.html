<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="left">
            <a href="#home">Home</a>
        </div>
        <div class="mid">
            <h1>Counter App</h1>
        </div>

    </nav>
    <div class="sep">

    </div>
    <main id="home">
        <div id="main">
            <h1 class="count" role="status" aria-live="polite" aria-atomic="true">0</h1>
            <button id="inc" type="button" aria-label="Increase count">+</button>
            <button id="dec" type="button" aria-label="Decrease count">-</button>
          
        </div>

        <p id="counter-status" role="status" aria-live="polite"></p>

        <div class="inc-dec">
            <label for="step">Increment/decrement by:</label>
            <input id="step" type="number" value="1" min="1" step="1" max="9007199254740991" class="changeBy">
        </div>

        <button class="reset" type="button">Reset</button>



        <script src="script.js"></script>
    </main>
</body>
</html>
